# Entorno del TP de carga: el extractor-service con 5 réplicas detrás de nginx, y
# los generadores de carga (k6 y Vegeta) a pedido.
# Los puertos del host son configurables (ver .env.example) por si ya están en uso.
services:
  # Sin ports: un puerto del host no se puede repartir entre réplicas.
  # Se accede sólo a través de extractor-lb.
  extractor:
    build: .
    command: ["uvicorn", "extractor_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-keep-alive", "60", "--no-access-log"]
    environment:
      # Sin valor: se pasa sólo si está definida en el host; si no, rige el
      # valor por defecto de extractor_service/config.py.
      - QUEUE_TIMEOUT_S
      - REQUEST_TIMEOUT_S
    deploy:
      # El TP permite hasta 5 réplicas; variable para comparar escenarios.
      replicas: ${EXTRACTOR_REPLICAS:-5}
      resources:
        # Límites máximos que admite el TP por réplica.
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  extractor-lb:
    image: nginx:1.27-alpine
    ports:
      # 8080 es el puerto al que apuntan los scripts del profesor.
      - "${EXTRACTOR_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      extractor:
        # nginx resuelve las IPs de las réplicas al arrancar: tienen que existir ya.
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # Con 256M el kernel mataba workers de nginx bajo el spike de 100 VUs.
          memory: 512M
    restart: unless-stopped

  # ── Pruebas de carga ────────────────────────────────────────────
  # Perfil "stress": no arrancan con `docker compose up`, se corren a pedido.
  # Los generadores también tienen límites explícitos. k6 necesita memoria para
  # los PDFs del script original, que se abren en el contexto de cada VU.
  k6:
    image: grafana/k6:2.3.0
    profiles: ["stress"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
    command: ["run", "--summary-export=/stress/results/k6-spike.json", "/stress/k6/spike.js"]
    environment:
      # Dashboard en vivo (http://localhost:5665) y exportado a HTML para el informe.
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_EXPORT=/stress/results/k6-spike.html
      # Límite blando para el recolector de Go: sin él k6 deja crecer la memoria
      # al doble de lo que usa y llegaba a ~3 GB, compitiendo con las réplicas.
      - GOMEMLIMIT=1GiB
    ports:
      - "5665:5665"
    volumes:
      - ./tests/stress:/stress
    depends_on:
      - extractor-lb

  vegeta:
    build: ./tests/stress/vegeta
    profiles: ["stress"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    entrypoint: ["sh", "/stress/vegeta/run.sh"]
    volumes:
      - ./tests/stress:/stress
    depends_on:
      - extractor-lb
